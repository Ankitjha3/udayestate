<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" fill="none">
  <defs>
    <linearGradient id="houseGrad" x1="140" y1="2" x2="140" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B9FD4"/>
      <stop offset="100%" stop-color="#1A3A6B"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="30" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#C9A84C"/>
      <stop offset="50%"  stop-color="#E8CF7A"/>
      <stop offset="75%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════
       HOUSE + UD MONOGRAM
       Outer shape: roof chevron + two side columns
       Inner cutout reveals white "U" and "D" shapes
  ══════════════════════════════════ -->

  <!-- Roof peak (chevron) -->
  <polygon points="140,3 198,52 188,52 140,13 92,52 82,52" fill="url(#houseGrad)"/>

  <!-- Left column (left wall of house / left stroke of U) -->
  <rect x="82" y="50" width="16" height="46" fill="url(#houseGrad)"/>

  <!-- Right column of U -->
  <rect x="122" y="64" width="14" height="32" fill="url(#houseGrad)"/>

  <!-- Bottom bar of U -->
  <rect x="82" y="84" width="54" height="12" rx="2" fill="url(#houseGrad)"/>

  <!-- Center divider between U and D -->
  <rect x="140" y="50" width="10" height="46" fill="url(#houseGrad)"/>

  <!-- Right outer wall of house / right stroke of D -->
  <rect x="182" y="50" width="16" height="46" fill="url(#houseGrad)"/>

  <!-- Top bar of D -->
  <rect x="150" y="50" width="42" height="12" rx="2" fill="url(#houseGrad)"/>

  <!-- Bottom bar of D -->
  <rect x="150" y="84" width="42" height="12" rx="2" fill="url(#houseGrad)"/>

  <!-- D right curve bump -->
  <path d="M188 62 Q210 78 188 96 L198 96 Q224 78 198 62 Z" fill="url(#houseGrad)"/>

  <!-- ══════════════════════════════════
       GOLD ARC SEPARATOR
  ══════════════════════════════════ -->
  <path d="M38 106 Q140 94 242 106" stroke="url(#goldLine)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ══════════════════════════════════
       LOGOTYPE
  ══════════════════════════════════ -->
  <text
    x="140"
    y="126"
    text-anchor="middle"
    font-family="Georgia, 'Book Antiqua', serif"
    font-size="20"
    font-weight="700"
    letter-spacing="5"
    fill="#1A3A6B"
  >UDAY ESTATE</text>
</svg>
