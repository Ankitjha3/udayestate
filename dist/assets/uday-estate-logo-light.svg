<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" fill="none">
  <defs>
    <!-- White-to-light-blue gradient for dark backgrounds -->
    <linearGradient id="houseGradLight" x1="140" y1="2" x2="140" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="goldLineLight" x1="30" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#C9A84C"/>
      <stop offset="50%"  stop-color="#E8CF7A"/>
      <stop offset="75%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Roof chevron -->
  <polygon points="140,3 198,52 188,52 140,13 92,52 82,52" fill="url(#houseGradLight)"/>

  <!-- Left wall / left U stroke -->
  <rect x="82" y="50" width="16" height="46" fill="url(#houseGradLight)"/>
  <!-- Right stroke of U -->
  <rect x="122" y="64" width="14" height="32" fill="url(#houseGradLight)"/>
  <!-- Bottom bar of U -->
  <rect x="82" y="84" width="54" height="12" rx="2" fill="url(#houseGradLight)"/>

  <!-- Centre divider -->
  <rect x="140" y="50" width="10" height="46" fill="url(#houseGradLight)"/>

  <!-- Right wall / outer D stroke -->
  <rect x="182" y="50" width="16" height="46" fill="url(#houseGradLight)"/>
  <!-- Top bar of D -->
  <rect x="150" y="50" width="42" height="12" rx="2" fill="url(#houseGradLight)"/>
  <!-- Bottom bar of D -->
  <rect x="150" y="84" width="42" height="12" rx="2" fill="url(#houseGradLight)"/>
  <!-- D curve -->
  <path d="M188 62 Q210 78 188 96 L198 96 Q224 78 198 62 Z" fill="url(#houseGradLight)"/>

  <!-- Gold arc -->
  <path d="M38 106 Q140 94 242 106" stroke="url(#goldLineLight)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Logotype in white -->
  <text
    x="140"
    y="126"
    text-anchor="middle"
    font-family="Georgia, 'Book Antiqua', serif"
    font-size="20"
    font-weight="700"
    letter-spacing="5"
    fill="#ffffff"
  >UDAY ESTATE</text>
</svg>
